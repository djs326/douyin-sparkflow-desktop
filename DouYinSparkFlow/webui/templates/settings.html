{% extends "base.html" %}

{% block nav_key %}settings{% endblock %}
{% block page_key %}settings{% endblock %}
{% block title %}系统设置{% endblock %}
{% block breadcrumb_title %}系统设置{% endblock %}

{% block content %}
<div class="page-stack">
  <div class="settings-grid">
    <section class="panel">
      <div style="padding: 18px 20px 22px;">
        <form method="post" action="/settings" class="stack-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="form-grid">
            <label><span>登录桌面 API</span><input type="text" name="login_desktop_api_url" value="{{ app_settings.login_desktop_api_url }}"></label>
            <label><span>Web UI 端口</span><input type="number" min="1" max="65535" name="ui_port" value="{{ app_settings.ui_port }}"></label>
          </div>
          <button class="button button-primary" type="submit"><i data-lucide="save"></i><span>保存运行参数</span></button>
        </form>
      </div>
    </section>

    <section class="panel">
      <div style="padding: 18px 20px 22px;">
        <form method="post" action="/settings/autostart" class="stack-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label class="check-row">
            <input type="checkbox" name="enabled" {% if autostart_enabled %}checked{% endif %}>
            <span>开机自动启动（登录 Windows 后自动运行，常驻系统托盘）</span>
          </label>
          <button class="button button-quiet" type="submit"><i data-lucide="power"></i><span>保存自启设置</span></button>
        </form>
      </div>
    </section>
  </div>
</div>
{% endblock %}
